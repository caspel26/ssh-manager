<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="112" x2="0" y2="912" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c2758"/>
      <stop offset="52%" stop-color="#1a1836"/>
      <stop offset="100%" stop-color="#100f20"/>
    </linearGradient>
    <linearGradient id="accent" x1="330" y1="360" x2="720" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9585ff"/>
      <stop offset="100%" stop-color="#4ecdc4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#7c6af7" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#7c6af7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="112" x2="0" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- squircle background -->
  <rect x="112" y="112" width="800" height="800" rx="188" fill="url(#bg)"/>
  <!-- inner accent glow -->
  <rect x="112" y="112" width="800" height="800" rx="188" fill="url(#glow)"/>
  <!-- top sheen for depth -->
  <rect x="112" y="112" width="800" height="800" rx="188" fill="url(#sheen)"/>
  <!-- hairline edge -->
  <rect x="113" y="113" width="798" height="798" rx="187" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>

  <!-- prompt chevron > -->
  <path d="M356 396 L520 512 L356 628" fill="none" stroke="url(#accent)" stroke-width="64"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor underscore _ -->
  <rect x="566" y="600" width="150" height="54" rx="27" fill="url(#accent)"/>
</svg>
